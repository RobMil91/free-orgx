<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTMX Login</title>
  <script src="https://unpkg.com.10</script>
</head>
<body>
  <h2>Login</h2>
  <form hx-post="/login" hx-target="#response" hx-swap="innerHTML">
    <label>
      Username:
      <input type="text" name="username" required>
    </label>
    <br>
    <label>
      Password:
      <input type="password" name="password" required>
    </label>
    <br>
    <button type="submit">Login</button>
  </form>

  <div id="response"></div>
</body>
</html>
