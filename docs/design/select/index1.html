<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Multi-Select</title>
  <style>
    :root {
      --primary: #3b82f6;
      --border: #e2e8f0;
      --text: #1e293b;
      --bg: #ffffff;
      --hover: #f8fafc;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      padding-top: 100px;
    }

    .select-container {
      width: 350px;
      position: relative;
      user-select: none;
    }

    /* The Box Users Click */
    .select-trigger {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      min-height: 42px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: all 0.2s;
    }

    .select-trigger:hover {
      border-color: #cbd5e1;
    }

    .select-container.active .select-trigger {
      border-color: var(--primary);
      ring: 3px rgba(59, 130, 246, 0.1);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .placeholder {
      color: #94a3b8;
      font-size: 14px;
    }

    /* Selected Tags */
    .tag {
      background: #eff6ff;
      color: var(--primary);
      font-size: 13px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #dbeafe;
    }

    .tag-remove {
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    /* Dropdown Menu */
    .select-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      display: none;
      z-index: 10;
      overflow: hidden;
      animation: fadeIn 0.15s ease-out;
    }

    .select-container.active .select-dropdown {
      display: block;
    }

    .dropdown-search {
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    .dropdown-search input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 14px;
      color: var(--text);
    }

    .options-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .option {
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .option:hover {
      background: var(--hover);
    }

    .option input {
      pointer-events: none;
      /* Let the div handle clicks */
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
