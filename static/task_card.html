<div class="task-card" id="todo-column" hx-swap-oob="beforeend">
  <div class="task-card" draggable="true" data-id="4" id={{ .ID }}>
    <div class="task-card-header">
      <span class="task-id">{{ .ID }}</span>
      <form id="taskCard">
        <div class="form-group">
          <input type="hidden" id="event-type" name="event-type" value="deleteTask">
          <input type="hidden" id="taskID" name="taskID" value={{ .ID }}>
        </div>
        <button class="task-delete" id="taskCard" hx-swap-oob="outerHTML" ws-send>
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
      </form>
      </path>
      </svg>
      </button>

      </form>
    </div>
    <div class="task-title">{{ .Title }}</div>
    <div class="task-description"> {{ .Description }}</div>
  </div>
</div>
