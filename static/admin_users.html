<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Free Orgx</title>
  <script src="/htmx.min.js"></script>
  <link rel="stylesheet" type="text/css" href="styles_admin_users.css">
</head>

<body>
  <header>
    <div class="logo">Free Orgx</div>
    <a href="/project" class="nav-btn">Back to Projects</a>
  </header>
  <main>
    <div class="card">
      <h1>Create New User</h1>
      <form hx-post="/admin/user/create" hx-trigger="submit" hx-target="#usersDiv" hx-swap="outerHTML">
        <div class="form-row">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
          </div>
          <button type="submit">Create User</button>
        </div>
      </form>
      <div id="result"></div>
    </div>
    <div id="usersDiv" class="card">
      <h2>Existing Users</h2>
      {{if .Users}}
      <ul class="user-list">
        {{range .Users}}
        <li class="user-item">
          <span class="user-name">{{.Name}}</span>
          <span class="user-role {{if eq .Role " admin"}}admin{{end}}">{{.Role}}</span>
        </li>
        {{end}}
      </ul>
      {{else}}
      <div class="empty-state">No users found.</div>
      {{end}}
    </div>
  </main>
</body>

</html>
