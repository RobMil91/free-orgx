<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-pale: #eff6ff;
            --primary-border: #bfdbfe;
            --white: #ffffff;
            --gray-100: #f8fafc;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-500: #64748b;
            --gray-700: #334155;
            --gray-900: #0f172a;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--gray-100);
            color: var(--gray-700);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            padding: 16px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 20px;
            height: 20px;
            color: var(--white);
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 150ms ease;
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
        }

        /* Main Board */
        .board {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            min-height: calc(100vh - 200px);
        }

        @media (max-width: 1024px) {
            .columns {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .columns {
                grid-template-columns: 1fr;
            }
            
            .header {
                padding: 12px 16px;
            }
            
            .board {
                padding: 16px;
            }
        }

        /* Column */
        .column {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 180px);
            transition: all 200ms ease;
        }

        .column.drag-over {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-pale), var(--shadow-md);
        }

        .column-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .column-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-title h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-900);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .column-count {
            background: var(--primary-pale);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .column-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .column[data-status="todo"] .column-icon { background: var(--primary); }
        .column[data-status="in-progress"] .column-icon { background: #f59e0b; }
        .column[data-status="done"] .column-icon { background: #10b981; }

        .column-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .column-body::-webkit-scrollbar {
            width: 6px;
        }

        .column-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .column-body::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 3px;
        }

        .column-body::-webkit-scrollbar-thumb:hover {
            background: var(--gray-500);
        }

        .column-footer {
            padding: 12px 16px 16px;
            border-top: 1px solid var(--gray-200);
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--gray-500);
            font-size: 14px;
        }

        .empty-state svg {
            width: 40px;
            height: 40px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* Task Card */
        .task-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            padding: 16px;
            cursor: grab;
            transition: all 200ms ease;
            position: relative;
        }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--gray-300);
        }

        .task-card:active {
            cursor: grabbing;
        }

        .task-card.dragging {
            opacity: 0.9;
            transform: scale(1.02) rotate(1deg);
            box-shadow: var(--shadow-xl);
            z-index: 1000;
        }

        .task-card.ghost {
            opacity: 0.4;
            border: 2px dashed var(--primary-border);
            background: var(--primary-pale);
        }

        .task-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .task-id {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 11px;
            color: var(--gray-500);
            background: var(--gray-100);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .task-delete {
            opacity: 0;
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: var(--gray-500);
            border-radius: 4px;
            transition: all 150ms ease;
            flex-shrink: 0;
        }

        .task-card:hover .task-delete {
            opacity: 1;
        }

        .task-delete:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        .task-delete svg {
            width: 16px;
            height: 16px;
        }

        .task-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-900);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-description {
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 8px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--gray-100);
        }

        .task-priority {
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .task-priority.high {
            background: #fee2e2;
            color: #dc2626;
        }

        .task-priority.medium {
            background: #fef3c7;
            color: #d97706;
        }

        .task-priority.low {
            background: #d1fae5;
            color: #059669;
        }

        /* Add Task Form */
        .add-task-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px;
            background: none;
            border: 1px dashed var(--gray-300);
            border-radius: var(--radius-md);
            color: var(--gray-500);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 150ms ease;
        }

        .add-task-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-pale);
        }

        .add-task-btn svg {
            width: 16px;
            height: 16px;
        }

        .add-task-form {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .add-task-form.active {
            display: flex;
        }

        .add-task-form input,
        .add-task-form textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            transition: all 150ms ease;
        }

        .add-task-form input:focus,
        .add-task-form textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-pale);
        }

        .add-task-form textarea {
            resize: none;
            min-height: 60px;
        }

        .add-task-actions {
            display: flex;
            gap: 8px;
        }

        .btn-add {
            flex: 1;
            padding: 8px 16px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 150ms ease;
        }

        .btn-add:hover {
            background: var(--primary-light);
        }

        .btn-cancel {
            padding: 8px 16px;
            background: var(--gray-100);
            color: var(--gray-700);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 150ms ease;
        }

        .btn-cancel:hover {
            background: var(--gray-200);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 200ms ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 90%;
            max-width: 480px;
            box-shadow: var(--shadow-xl);
            transform: scale(0.95) translateY(10px);
            transition: all 200ms ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-900);
        }

        .modal-close {
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: var(--gray-500);
            border-radius: 4px;
            transition: all 150ms ease;
        }

        .modal-close:hover {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .modal-close svg {
            width: 20px;
            height: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            transition: all 150ms ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-pale);
        }

        .form-group textarea {
            resize: none;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-actions .btn-primary {
            flex: 1;
            justify-content: center;
        }

        .modal-actions .btn-secondary {
            padding: 10px 20px;
            background: var(--gray-100);
            color: var(--gray-700);
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 150ms ease;
        }

        .modal-actions .btn-secondary:hover {
            background: var(--gray-200);
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px var(--primary-pale); }
            50% { box-shadow: 0 0 0 6px var(--primary-pale); }
        }

        .column.drag-over {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-card {
            animation: slideIn 200ms ease-out;
        }

        /* Selection */
        ::selection {
            background: var(--primary-pale);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                </div>
                <h1>Task Board</h1>
            </div>
            <button class="btn-primary" onclick="openModal()">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
                New Task
            </button>
        </div>
    </header>

    <main class="board">
        <div class="columns">
            <div class="column" data-status="todo">
                <div class="column-header">
                    <div class="column-title">
                        <span class="column-icon"></span>
                        <h2>To Do</h2>
                    </div>
                    <span class="column-count" data-count="todo">0</span>
                </div>
                <div class="column-body" data-column="todo"></div>
            </div>

            <div class="column" data-status="in-progress">
                <div class="column-header">
                    <div class="column-title">
                        <span class="column-icon"></span>
                        <h2>In Progress</h2>
                    </div>
                    <span class="column-count" data-count="in-progress">0</span>
                </div>
                <div class="column-body" data-column="in-progress"></div>
            </div>
            <div class="column" data-status="done">
                <div class="column-header">
                    <div class="column-title">
                        <span class="column-icon"></span>
                        <h2>Done</h2>
                    </div>
                    <span class="column-count" data-count="done">0</span>
                </div>
                <div class="column-body" data-column="done"></div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
            <div class="modal-header">
                <h3>Create New Task</h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="taskForm" onsubmit="createTask(event)">
                <div class="form-group">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" name="title" placeholder="Enter task title" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" name="description" placeholder="Describe the task..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus" name="status">
                            <option value="todo">To Do</option>
                            <option value="in-progress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority" name="priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                        Create Task
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let taskIdCounter = parseInt(localStorage.getItem('taskIdCounter')) || 1;
        let draggedTask = null;
        let draggedElement = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderAllTasks();
            setupDragAndDrop();
        });

        // Storage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            localStorage.setItem('taskIdCounter', taskIdCounter.toString());
        }

        // Render
        function renderAllTasks() {
            const columns = ['todo', 'in-progress', 'done'];
            columns.forEach(status => {
                const column = document.querySelector(`[data-column="${status}"]`);
                column.innerHTML = '';
                const columnTasks = tasks.filter(t => t.status === status);
                
                if (columnTasks.length === 0) {
                    column.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                            </svg>
                            <p>No tasks yet</p>
                        </div>
                    `;
                } else {
                    columnTasks.forEach(task => {
                        column.appendChild(createTaskCard(task));
                    });
                }
                
                updateCount(status);
            });
            setupDragAndDrop();
        }

        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.draggable = true;
            card.dataset.id = task.id;
            
            card.innerHTML = `
                <div class="task-card-header">
                    <span class="task-id">#${task.id.toString().padStart(3, '0')}</span>
                    <button class="task-delete" onclick="deleteTask(${task.id})">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
                <div class="task-title">${escapeHtml(task.title)}</div>
                ${task.description ? `<div class="task-description">${escapeHtml(task.description)}</div>` : ''}
                ${task.priority !== 'medium' ? `<div class="task-meta"><span class="task-priority ${task.priority}">${task.priority}</span></div>` : ''}
            `;
            
            return card;
        }

        function updateCount(status) {
            const count = tasks.filter(t => t.status === status).length;
            document.querySelector(`[data-count="${status}"]`).textContent = count;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Drag and Drop
        function setupDragAndDrop() {
            document.querySelectorAll('.task-card').forEach(card => {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
            });

            document.querySelectorAll('.column-body').forEach(column => {
                column.addEventListener('dragover', handleDragOver);
                column.addEventListener('dragenter', handleDragEnter);
                column.addEventListener('dragleave', handleDragLeave);
                column.addEventListener('drop', handleDrop);
            });
        }

        function handleDragStart(e) {
            draggedElement = e.target;
            draggedTask = tasks.find(t => t.id === parseInt(e.target.dataset.id));
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', e.target.dataset.id);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.column').forEach(col => col.classList.remove('drag-over'));
            draggedTask = null;
            draggedElement = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            e.preventDefault();
            const column = e.target.closest('.column');
            if (column) {
                column.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const column = e.target.closest('.column');
            if (column && !column.contains(e.relatedTarget)) {
                column.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            const column = e.target.closest('.column');
            if (column && draggedTask) {
                const newStatus = column.dataset.status;
                if (draggedTask.status !== newStatus) {
                    draggedTask.status = newStatus;
                    saveTasks();
                    renderAllTasks();
                }
            }
            document.querySelectorAll('.column').forEach(col => col.classList.remove('drag-over'));
        }

        // Add Task
        function showAddForm(status) {
            const column = document.querySelector(`[data-status="${status}"]`);
            const btn = column.querySelector('.add-task-btn');
            const form = column.querySelector('.add-task-form');
            btn.style.display = 'none';
            form.classList.add('active');
            form.querySelector('input').focus();
        }

        function hideAddForm(status) {
            const column = document.querySelector(`[data-status="${status}"]`);
            const btn = column.querySelector('.add-task-btn');
            const form = column.querySelector('.add-task-form');
            form.classList.remove('active');
            form.reset();
            btn.style.display = 'flex';
        }

        function addTask(e, status) {
            e.preventDefault();
            const form = e.target;
            const title = form.title.value.trim();
            const description = form.description.value.trim();
            
            if (!title) return;
            
            const task = {
                id: taskIdCounter++,
                title,
                description,
                status,
                priority: 'medium'
            };
            
            tasks.push(task);
            saveTasks();
            form.reset();
            hideAddForm(status);
            renderAllTasks();
        }

        // Delete Task
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderAllTasks();
        }

        // Modal
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('taskTitle').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('taskForm').reset();
        }

        function closeModalOnOverlay(e) {
            if (e.target === e.currentTarget) {
                closeModal();
            }
        }

        function createTask(e) {
            e.preventDefault();
            const form = e.target;
            const title = form.title.value.trim();
            const description = form.description.value.trim();
            const status = form.status.value;
            const priority = form.priority.value;
            
            if (!title) return;
            
            const task = {
                id: taskIdCounter++,
                title,
                description,
                status,
                priority
            };
            
            tasks.push(task);
            saveTasks();
            closeModal();
            renderAllTasks();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                document.querySelectorAll('.add-task-form.active').forEach(form => {
                    form.classList.remove('active');
                    form.previousElementSibling.style.display = 'flex';
                    form.reset();
                });
            }
            if (e.key === 'n' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                openModal();
            }
        });

        // Sample data if empty
        if (tasks.length === 0) {
            tasks = [
                { id: taskIdCounter++, title: 'Research competitor products', description: 'Analyze top 5 competitors and document their key features', status: 'todo', priority: 'high' },
                { id: taskIdCounter++, title: 'Update documentation', description: 'Review and update API documentation for v2 release', status: 'todo', priority: 'medium' },
                { id: taskIdCounter++, title: 'Design system audit', description: 'Review current components for consistency', status: 'todo', priority: 'medium' },
                { id: taskIdCounter++, title: 'User authentication flow', description: 'Implement OAuth2 integration with Google and GitHub', status: 'todo', priority: 'high' },
                { id: taskIdCounter++, title: 'Dashboard redesign', description: 'Create wireframes for new analytics dashboard', status: 'in-progress', priority: 'high' },
                { id: taskIdCounter++, title: 'Fix navigation bug', description: 'Menu not closing on mobile after selection', status: 'in-progress', priority: 'low' },
                { id: taskIdCounter++, title: 'Setup CI/CD pipeline', description: 'Configure GitHub Actions for automated deployment', status: 'done', priority: 'medium' },
                { id: taskIdCounter++, title: 'Database migration', description: 'Migrate user data to new schema', status: 'done', priority: 'high' }
            ];
            saveTasks();
            renderAllTasks();
        }
    </script>
</body>
</html>
