<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
  <script src="/htmx.min.js"></script>
  <script src="/htmx-ext-ws.js"></script>
  <link rel="stylesheet" type="text/css" href="styles_dashboard.css">
</head>
<body>

    <main class="board">
        <div class="columns">
            <div class="column" data-status="todo">
                <div class="column-header">
                    <div class="column-title">
                        <span class="column-icon"></span>
                        <h2>To Do</h2>
                    </div>
                    <span class="column-count" data-count="todo">0</span>
                </div>
                <div class="column-body" data-column="todo"></div>
            </div>

            <div class="column" data-status="in-progress">
                <div class="column-header">
                    <div class="column-title">
                        <span class="column-icon"></span>
                        <h2>In Progress</h2>
                    </div>
                    <span class="column-count" data-count="in-progress">0</span>
                </div>
                <div class="column-body" data-column="in-progress"></div>
            </div>
            <div class="column" data-status="done">
                <div class="column-header">
                    <div class="column-title">
                        <span class="column-icon"></span>
                        <h2>Done</h2>
                    </div>
                    <span class="column-count" data-count="done">0</span>
                </div>
                <div class="column-body" data-column="done"></div>
            </div>
        </div>
            <button class="btn-primary" onclick="openModal()">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
                New Task
            </button>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
            <div class="modal-header">
                <h3>Create New Task</h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="taskForm" onsubmit="createTask(event)">
                <div class="form-group">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" name="title" placeholder="Enter task title" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" name="description" placeholder="Describe the task..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus" name="status">
                            <option value="todo">To Do</option>
                            <option value="in-progress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority" name="priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                        Create Task
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let taskIdCounter = parseInt(localStorage.getItem('taskIdCounter')) || 1;
        let draggedTask = null;
        let draggedElement = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderAllTasks();
            setupDragAndDrop();
        });

        // Storage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            localStorage.setItem('taskIdCounter', taskIdCounter.toString());
        }

        // Render
        function renderAllTasks() {
            const columns = ['todo', 'in-progress', 'done'];
            columns.forEach(status => {
                const column = document.querySelector(`[data-column="${status}"]`);
                column.innerHTML = '';
                const columnTasks = tasks.filter(t => t.status === status);
                
                if (columnTasks.length === 0) {
                    column.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                            </svg>
                            <p>No tasks yet</p>
                        </div>
                    `;
                } else {
                    columnTasks.forEach(task => {
                        column.appendChild(createTaskCard(task));
                    });
                }
                
                updateCount(status);
            });
            setupDragAndDrop();
        }

        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.draggable = true;
            card.dataset.id = task.id;
            
            card.innerHTML = `
                <div class="task-card-header">
                    <span class="task-id">#${task.id.toString().padStart(3, '0')}</span>
                    <button class="task-delete" onclick="deleteTask(${task.id})">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
                <div class="task-title">${escapeHtml(task.title)}</div>
                ${task.description ? `<div class="task-description">${escapeHtml(task.description)}</div>` : ''}
                ${task.priority !== 'medium' ? `<div class="task-meta"><span class="task-priority ${task.priority}">${task.priority}</span></div>` : ''}
            `;
            
            return card;
        }

        function updateCount(status) {
            const count = tasks.filter(t => t.status === status).length;
            document.querySelector(`[data-count="${status}"]`).textContent = count;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Drag and Drop
        function setupDragAndDrop() {
            document.querySelectorAll('.task-card').forEach(card => {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
            });

            document.querySelectorAll('.column-body').forEach(column => {
                column.addEventListener('dragover', handleDragOver);
                column.addEventListener('dragenter', handleDragEnter);
                column.addEventListener('dragleave', handleDragLeave);
                column.addEventListener('drop', handleDrop);
            });
        }

        function handleDragStart(e) {
            draggedElement = e.target;
            draggedTask = tasks.find(t => t.id === parseInt(e.target.dataset.id));
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', e.target.dataset.id);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.column').forEach(col => col.classList.remove('drag-over'));
            draggedTask = null;
            draggedElement = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            e.preventDefault();
            const column = e.target.closest('.column');
            if (column) {
                column.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const column = e.target.closest('.column');
            if (column && !column.contains(e.relatedTarget)) {
                column.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            const column = e.target.closest('.column');
            if (column && draggedTask) {
                const newStatus = column.dataset.status;
                if (draggedTask.status !== newStatus) {
                    draggedTask.status = newStatus;
                    saveTasks();
                    renderAllTasks();
                }
            }
            document.querySelectorAll('.column').forEach(col => col.classList.remove('drag-over'));
        }

        // Add Task
        function showAddForm(status) {
            const column = document.querySelector(`[data-status="${status}"]`);
            const btn = column.querySelector('.add-task-btn');
            const form = column.querySelector('.add-task-form');
            btn.style.display = 'none';
            form.classList.add('active');
            form.querySelector('input').focus();
        }

        function hideAddForm(status) {
            const column = document.querySelector(`[data-status="${status}"]`);
            const btn = column.querySelector('.add-task-btn');
            const form = column.querySelector('.add-task-form');
            form.classList.remove('active');
            form.reset();
            btn.style.display = 'flex';
        }

        function addTask(e, status) {
            e.preventDefault();
            const form = e.target;
            const title = form.title.value.trim();
            const description = form.description.value.trim();
            
            if (!title) return;
            
            const task = {
                id: taskIdCounter++,
                title,
                description,
                status,
                priority: 'medium'
            };
            
            tasks.push(task);
            saveTasks();
            form.reset();
            hideAddForm(status);
            renderAllTasks();
        }

        // Delete Task
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderAllTasks();
        }

        // Modal
        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('taskTitle').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('taskForm').reset();
        }

        function closeModalOnOverlay(e) {
            if (e.target === e.currentTarget) {
                closeModal();
            }
        }

        function createTask(e) {
            e.preventDefault();
            const form = e.target;
            const title = form.title.value.trim();
            const description = form.description.value.trim();
            const status = form.status.value;
            const priority = form.priority.value;
            
            if (!title) return;
            
            const task = {
                id: taskIdCounter++,
                title,
                description,
                status,
                priority
            };
            
            tasks.push(task);
            saveTasks();
            closeModal();
            renderAllTasks();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                document.querySelectorAll('.add-task-form.active').forEach(form => {
                    form.classList.remove('active');
                    form.previousElementSibling.style.display = 'flex';
                    form.reset();
                });
            }
            if (e.key === 'n' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                openModal();
            }
        });

        // Sample data if empty
        if (tasks.length === 0) {
            tasks = [
                { id: taskIdCounter++, title: 'Research competitor products', description: 'Analyze top 5 competitors and document their key features', status: 'todo', priority: 'high' },
                { id: taskIdCounter++, title: 'Update documentation', description: 'Review and update API documentation for v2 release', status: 'todo', priority: 'medium' },
                { id: taskIdCounter++, title: 'Design system audit', description: 'Review current components for consistency', status: 'todo', priority: 'medium' },
                { id: taskIdCounter++, title: 'User authentication flow', description: 'Implement OAuth2 integration with Google and GitHub', status: 'todo', priority: 'high' },
                { id: taskIdCounter++, title: 'Dashboard redesign', description: 'Create wireframes for new analytics dashboard', status: 'in-progress', priority: 'high' },
                { id: taskIdCounter++, title: 'Fix navigation bug', description: 'Menu not closing on mobile after selection', status: 'in-progress', priority: 'low' },
                { id: taskIdCounter++, title: 'Setup CI/CD pipeline', description: 'Configure GitHub Actions for automated deployment', status: 'done', priority: 'medium' },
                { id: taskIdCounter++, title: 'Database migration', description: 'Migrate user data to new schema', status: 'done', priority: 'high' }
            ];
            saveTasks();
            renderAllTasks();
        }
    </script>
</body>
</html>
