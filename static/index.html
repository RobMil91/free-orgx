<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Orgx</title>
  <script src="/htmx.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    .btn {
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #007bff;
      color: #fff;
    }
    .btn-primary:hover { background: #0056b3; }
    .btn-secondary {
      background: #fff;
      color: #333;
      border: 1px solid #ddd;
    }
    .btn-secondary:hover { background: #f8f9fa; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Free Orgx</h1>
    <p class="subtitle">Simple organization tool</p>
    <div class="btn-group">
      <a href="/login" class="btn btn-primary">Sign In</a>
      <a href="/project" class="btn btn-secondary">Projects</a>
    </div>
  </div>
</body>
</html>
