<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
  <link rel="stylesheet" type="text/css" href="/styles_project.css">
  <link rel="stylesheet" type="text/css" href="/styles_taskboard.css">
  <script src="/htmx.min.js"></script>
  <script src="/htmx.ws.js"></script>
</head>
  <body>
            <div class="modal-header">
                <h3>Create New Task</h3>
                <button class="modal-close" hx-get="/projects/{{ .ID }}/tasks" hx-target="#taskboard_content">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" name="title" placeholder="Enter task title" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" name="description" placeholder="Describe the task..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus" name="status">
                            <option value="todo">To Do</option>
                            <option value="in-progress">In Progress</option>
                            <!-- <option value="done">Done</option> -->
                        </select>
                    </div>
                    <div class="form-group">
                    <label for="deadline">Deadline</label>
                    <input type="datetime-local" id="deadline" name="deadline" placeholder="Enter done time" required>
                    </div>

          <div class="form-group">
           <input type="hidden" id="event-type" name="event-type" value="create"> 
          </div>
          <!--           <div class="form-group"> -->
          <!-- <input type="hidden" id="cookie" name="session-cookie" value={{ .AUTH }}> -->
          <!--           </div> -->
                </div>

                <div class="modal-actions">
                    <a type="button" class="btn-secondary"  hx-get="/projects/{{ .ID }}/tasks" hx-target="#taskboard_content">Cancel</a>

                    <button type="submit" class="btn-primary" id="taskForm" ws-send>
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                        Summit
                    </button>
                </div>
            </form>
</body>
</html>
