
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
  <link rel="stylesheet" type="text/css" href="/styles_project.css">
  <link rel="stylesheet" type="text/css" href="/styles_taskboard.css">
  <script src="/htmx.min.js"></script>
  <script src="/htmx.ws.js"></script>
</head>
  <header>
    <div>
    <a href="/" class="logo">Free Orgx</a>
      </div>
    <div>
      <span class="user-info">{{.Username}}</span>
      {{if .IsAdmin}}
      <a href="/users" class="nav-btn primary">Manage Users</a>
      {{end}}
      <a href="/project" class="nav-btn primary" >Projects</a>
      <a href="/logout" class="nav-btn">Logout</a>
    </div>
  </header>
  <!-- <body hx-ext="ws" ws-connect="/projects/{{ .ID }}/ws"> -->

  <body>
            <div class="modal-header">
                <h3>Create New Task</h3>
                <button class="modal-close">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" name="title" placeholder="Enter task title" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" name="description" placeholder="Describe the task..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus" name="status">
                            <option value="todo">To Do</option>
                            <option value="in-progress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority" name="priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>

                <div class="modal-actions">
                    <a type="button" class="btn-secondary"  href="/projects/{{ .ID }}/tasks" >Cancel</a>
                    <button type="submit" class="btn-primary">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                        Summit
                    </button>
                </div>
            </form>
</body>
</html>
