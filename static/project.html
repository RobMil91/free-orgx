<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - Free Orgx</title>
  <script src="/htmx.min.js"></script>
  <link rel="stylesheet" type="text/css" href="styles_project.css">
  <link rel="stylesheet" type="text/css" href="styles_dashboard.css">
</head>
<body>
  <header>
    <div>
    <a href="/" class="logo">Free Orgx</a>
      </div>
    <div>
      <span class="user-info">{{.Username}}</span>
      {{if .IsAdmin}}
      <a href="/users" class="nav-btn primary">Manage Users</a>
      {{end}}
      <a href="/project" class="nav-btn primary" >Projects</a>
      <a href="/logout" class="nav-btn">Logout</a>
    </div>
  </header>
  <main>
      <div class="main" id="pagemain">
    <!-- <div id="projects" class="card"> -->
      <h2>Your Projects</h2>
      {{if .Projects}}
      <ul  class="project-list">
        {{range .Projects}}
        <li class="project-item">

    <div  hx-get="/projects/{{ .ID }}/tasks" hx-target="#pagemain">
            <div>
            <span class="project-name" >{{.Name}}</span>
          <span class="project-id">ID: {{.ID}}</span>
                <button 
                    hx-delete="project/delete/{{.ID}}"
                    hx-target="closest li"
                    hx-swap="outerHTML"
                    >
                    Delete
                </button> 
            </div>
            </div>
        </li>
        {{end}}
      </ul>
      {{else}}
      <div class="empty-state">No projects yet. Create one above!</div>
      {{end}}

    <form
     hx-post="/project/create"
      hx-trigger="submit"
       hx-target="#projects"
        hx-swap="beforeend"> 
    <input type="text" name="name" placeholder="Enter project name" required>
    <button type="submit"> Create </button>
        </form>

    </div>
      <!-- </div> -->
  </main>
</body>
</html>
